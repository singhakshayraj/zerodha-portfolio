<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var t=localStorage.getItem("zpi-theme");if(t==="light")document.body.classList.add("light");})()</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/dashboard/zpi.css"/>
  <title>Login — Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-ui);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .brand {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 36px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      margin-bottom: var(--sp-5);
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: var(--accent); }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-lg);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    .error {
      margin-top: 14px;
      font-size: 13px;
      color: var(--negative);
      min-height: 18px;
    }
    .theme-toggle {
      position: fixed;
      top: 14px;
      right: 16px;
      background: none;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font-ui);
      padding: 4px 10px;
      transition: border-color 0.15s, color 0.15s;
      width: auto;
    }
    .theme-toggle:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">☀ Light</button>
  <div class="card">
    <div class="brand">📈 Portfolio</div>
    <div class="sub">Enter password to continue</div>
    <input type="password" id="pw" placeholder="Password" autofocus/>
    <button onclick="login()">Unlock</button>
    <div class="error" id="err"></div>
  </div>
  <script>
    function toggleTheme() {
      var isLight = document.body.classList.toggle('light');
      localStorage.setItem('zpi-theme', isLight ? 'light' : 'dark');
      document.querySelector('.theme-toggle').textContent = isLight ? '☾ Dark' : '☀ Light';
    }
    // Sync button label on load
    if (document.body.classList.contains('light')) {
      document.querySelector('.theme-toggle').textContent = '☾ Dark';
    }

    // Allow pressing Enter
    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    function login() {
      const pw = document.getElementById('pw').value;
      if (pw === 'akshay123') {
        localStorage.setItem('pf_auth', '1');
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.href = next;
      } else {
        document.getElementById('err').textContent = 'Incorrect password.';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }
  </script>
<div id="build-badge" style="position:fixed;bottom:8px;right:12px;font-size:10px;opacity:0.4;font-family:monospace;z-index:9999;cursor:default" title="Deployed build time"></div>
<script>
fetch("/api/version").then(r=>r.json()).then(d=>{
  const t=d.buildTime||d.version;
  if(t){const dt=new Date(t);document.getElementById("build-badge").textContent="build "+dt.toISOString().slice(0,16).replace("T"," ");}
}).catch(()=>{});
</script>
</body>
</html>
