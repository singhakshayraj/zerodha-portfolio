name: Session Monitor

on:
  schedule:
    # Every 30 min, 9:30 AM – 3:30 PM IST (4:00 AM – 10:00 AM UTC), weekdays
    - cron: '0,30 4,5,6,7,8,9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run session monitor
        run: node modules/auto-trade/monitor.js
        env:
          RUNTIME_MODE: server
          KITE_ENCTOKEN: ${{ secrets.KITE_ENCTOKEN }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPSTASH_REDIS_URL:   ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
