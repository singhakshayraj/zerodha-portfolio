name: Session Monitor

on:
  schedule:
    # Every 30 min, 9:30 AM – 3:30 PM IST (4:00 AM – 10:00 AM UTC), weekdays
    - cron: '0,30 4,5,6,7,8,9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check P&L and circuit breaker
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-Kite-Enctoken: ${{ secrets.KITE_ENCTOKEN }}" \
            "${{ vars.VERCEL_APP_URL }}/api/orders?action=session_monitor")

          BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP=$(echo "$RESPONSE" | tail -1)
          echo "HTTP $HTTP — $BODY"

          if [ "$HTTP" != "200" ]; then
            echo "::error::Session monitor failed (HTTP $HTTP): $BODY"
            exit 1
          fi

          CIRCUIT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('circuit_fired',False))" 2>/dev/null || echo "False")
          if [ "$CIRCUIT" = "True" ]; then
            REASON=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('stop_reason','?'))" 2>/dev/null || echo "?")
            echo "⚠️ Circuit breaker fired: $REASON — GTTs cancelled, please exit positions manually"
          else
            PNL=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('realized_pnl','?'))" 2>/dev/null || echo "?")
            OPEN=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('open_trades','?'))" 2>/dev/null || echo "?")
            echo "✅ Monitor OK — realized P&L: ₹$PNL, open trades: $OPEN"
          fi
