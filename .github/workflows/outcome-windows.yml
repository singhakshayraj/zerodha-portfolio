name: Brain Outcome Window Evaluator

# Evaluates brain pick outcome windows at the three key IST timestamps.
# Calls POST /api/intel?action=record_outcome with no body — the endpoint
# auto-fetches live NSE prices for all pending picks and records realized
# returns + direction accuracy into brain_outcomes and brain_source_stats.
#
# Window schedule (IST = UTC+5:30):
#   09:45 IST → 04:15 UTC — 30min window for picks emitted at open (09:15)
#   10:15 IST → 04:45 UTC — 1hr  window for picks emitted at open
#   15:35 IST → 10:05 UTC — EOD  window (375 min from open) for all picks

on:
  schedule:
    - cron: '15 4 * * 1-5'   # 09:45 IST — 30min evaluation
    - cron: '45 4 * * 1-5'   # 10:15 IST — 1hr  evaluation
    - cron: '5 10 * * 1-5'   # 15:35 IST — EOD  evaluation
  workflow_dispatch:          # manual trigger for testing

jobs:
  record-outcomes:
    runs-on: ubuntu-latest

    steps:
      - name: Record matured outcome windows
        run: |
          STATUS=$(curl -s -o /tmp/outcome_response.json -w "%{http_code}" \
            -X POST "${{ vars.VERCEL_APP_URL }}/api/intel?action=record_outcome" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP status: $STATUS"
          echo "Response: $(cat /tmp/outcome_response.json)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::record_outcome returned HTTP $STATUS"
            exit 1
          fi
